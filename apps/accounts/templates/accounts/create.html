{% extends "common/base.html" %}

{% block title %}ساخت حساب{% endblock %}

{% block content %}

  <a href="{% url 'accounts:list' %}" class="back-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="15" height="15"><path d="M15 6l-6 6 6 6" /></svg>
    برگشت به حساب‌ها
  </a>

  <div class="page-header">
    <div>
      <h1 class="page-header__title">ساخت حساب جدید</h1>
      <p class="page-header__meta">یک حساب بانکی، نقدی یا کارت جدید اضافه کنید.</p>
    </div>
  </div>

  <div class="form-card">
    <form method="post">
      {% csrf_token %}
      {% include "accounts/_form.html" %}

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">ساخت حساب</button>
        <a href="{% url 'accounts:list' %}" class="btn btn-ghost">انصراف</a>
      </div>
    </form>
  </div>

{% endblock %}
