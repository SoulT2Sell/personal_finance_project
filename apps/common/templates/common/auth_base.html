{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}مدیریت مالی{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="{% static 'common/css/base.css' %}" />
  {% block extra_css %}{% endblock %}
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="auth-brand-mark">مم</span>
        <span style="font-weight: 700;">دفتر مالی</span>
      </div>

      {% block auth_content %}{% endblock %}
    </div>
  </div>

  <script src="{% static 'common/js/base.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
