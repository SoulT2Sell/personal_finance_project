{% extends "common/base.html" %}

{% block title %}ویرایش کتگوری{% endblock %}

{% block content %}

  <a href="{% url 'categories:detail' category.slug %}" class="back-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="15" height="15"><path d="M15 6l-6 6 6 6" /></svg>
    برگشت
  </a>

  <div class="page-header">
    <div>
      <h1 class="page-header__title">ویرایش کتگوری</h1>
      <p class="page-header__meta">{{ category.name }}</p>
    </div>
  </div>

  <div class="form-card">
    <form method="post">
      {% csrf_token %}
      {% include "categories/_form.html" %}

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">ذخیره تغییرات</button>
        <a href="{% url 'categories:detail' category.slug %}" class="btn btn-ghost">انصراف</a>
      </div>
    </form>
  </div>

{% endblock %}
